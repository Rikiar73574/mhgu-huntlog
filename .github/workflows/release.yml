name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the pinned plugin toolchain
        run: rustup toolchain install nightly-2026-11-02 --component rust-src --profile minimal
      - name: Build and test the plugin
        run: |
          ./combined/build-local.sh --online
          python -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_part_ui.cjs
          node tests/test_charge_ui.cjs
          node tests/test_timeline_ui.cjs
          python tools/package.py
          python tools/package.py --source
      - uses: actions/upload-artifact@v7
        with:
          name: mod-and-source
          path: dist/huntlog-*.zip
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0
      - run: python -m pip install -r requirements-desktop.txt
      - name: Test native dashboard
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build native application archive
        run: python tools/build_app.py
      - name: Test the packaged executable
        shell: bash
        run: |
          python tools/smoke_app.py
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/HuntLog-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Checksum and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum * > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; validated archives remain available as workflow artifacts.'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "HuntLog $GITHUB_REF_NAME" --notes-file docs/release.md release/*
          fi
