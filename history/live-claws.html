<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arzuros (Live claws)</title>
<style>li{white-space:pre-line}
:root{color-scheme:dark;font:18px system-ui;background:#17120e;color:#f8eedc}body{max-width:760px;margin:5vh auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px}small,p{color:#bdb19e}#connection{color:#e4c94c}article{border:1px solid #66503a;border-top:3px solid #e4c94c;border-radius:6px;padding:26px;background:#241b15}.value{font-size:80px;font-weight:750;font-variant-numeric:tabular-nums}.bar{height:22px;background:#100d0a;border-radius:4px;overflow:hidden}#fill{height:100%;background:#e4c94c;transition:width .18s}.stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:24px}.stats strong{display:block;font-size:30px}#events{padding-left:20px;line-height:1.8}#broken{color:#e4c94c}a{color:#e4c94c}
</style>
<header><h1>Arzuros / Claws</h1><span id="connection">Connecting…</span></header>
<article><small>Flinch HP remaining<br>arms / claws</small><div class="value" id="pool">—</div><div class="bar"><div id="fill" style="width:0"></div></div><p>Bar reference: 76 HP at the start of this hunt. The pool can refill after a flinch.</p><div class="stats"><div><small>Claws</small><strong id="broken">—</strong></div><div><small>Flinches</small><strong id="flinches">—</strong></div><div><small>Monster HP</small><strong id="hp">—</strong></div></div></article>
<h2>Live changes</h2><ul id="events"><li>Waiting for the next hit…</li></ul><p>Read-only<br>updates every 250 ms<br><a href="http://127.0.0.1:8768/">Hunt history</a></p>
<script>
const $=id=>document.getElementById(id);let previous=null,logged=false;
function log(text){if(!logged){$('events').replaceChildren();logged=true;}const li=document.createElement('li');li.textContent=new Date().toLocaleTimeString()+'\n'+text;$('events').prepend(li);while($('events').children.length>12)$('events').lastChild.remove();}
async function poll(){try{const response=await fetch('/api/live',{signal:AbortSignal.timeout(2000)});const d=await response.json();if(!response.ok)throw Error(d.error);$('connection').textContent='● Live';$('pool').textContent=d.pool;$('fill').style.width=Math.max(0,Math.min(100,d.pool/76*100))+'%';$('hp').textContent=d.hp;$('flinches').textContent=d.flinches;$('broken').textContent=d.broken?'BROKEN':'Intact';if(previous&&previous.actor===d.actor){if(d.pool!==previous.pool)log(`Claw pool ${previous.pool} → ${d.pool}`);if(d.broken&&!previous.broken)log('Claws broken');if(d.flinches!==previous.flinches)log(`Flinches ${previous.flinches} → ${d.flinches}`);}previous=d;}catch(e){$('connection').textContent=e.message;$('pool').textContent='—';$('fill').style.width='0';$('hp').textContent='—';$('flinches').textContent='—';$('broken').textContent='Unavailable';previous=null;}setTimeout(poll,250);}poll();
</script></html>
